<style>
:root{
  --ink:#0E1A2B;
  --ink-2:#17293F;
  --parchment:#F0E9D8;
  --parchment-2:#E2D8BF;
  --saffron:#E0A038;
  --olive:#7F9668;
  --crimson:#BF4132;
  --teal:#5C97A6;
  --muted:#8496A8;
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{
  background:var(--ink);
  color:var(--parchment);
  font-family:"Fira Sans",system-ui,-apple-system,"Helvetica Neue",sans-serif;
  display:flex;flex-direction:column;
  min-height:100vh;min-height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
.wrap{width:100%;max-width:560px;margin:0 auto;padding:14px 16px 20px;flex:1;display:flex;flex-direction:column}

/* ---- header ---- */
header{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:14px}
h1{font-family:"Alegreya",Georgia,serif;font-weight:700;font-size:26px;margin:0;letter-spacing:.01em}
h1 em{font-style:italic;color:var(--saffron)}
.count{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}

/* ---- piles ---- */
.piles{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:16px}
.pile{
  border:1px solid rgba(240,233,216,.16);border-radius:var(--r);
  padding:11px 6px 10px;text-align:left;background:var(--ink-2);
  transition:transform .12s ease, border-color .12s ease;
}
.pile:active{transform:scale(.97)}
.pile .num{font-family:"Alegreya",serif;font-size:24px;line-height:1;font-weight:700;display:block}
.pile .lbl{font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-top:5px;display:block}
.pile[data-p="live"] .num{color:var(--saffron)}
.pile[data-p="known"] .num{color:var(--olive)}
.pile[data-p="important"] .num{color:var(--crimson)}
.pile[data-p="almost"] .num{color:var(--teal)}
.pile.on{border-color:currentColor}
.pile[data-p="live"].on{border-color:var(--saffron);box-shadow:inset 0 0 0 1px var(--saffron)}
.pile[data-p="known"].on{border-color:var(--olive);box-shadow:inset 0 0 0 1px var(--olive)}
.pile[data-p="important"].on{border-color:var(--crimson);box-shadow:inset 0 0 0 1px var(--crimson)}
.pile[data-p="almost"].on{border-color:var(--teal);box-shadow:inset 0 0 0 1px var(--teal)}
.pile.on .lbl{color:var(--parchment)}

/* ---- card ---- */
.stage{flex:1;display:flex;flex-direction:column;justify-content:flex-start;min-height:0}
.card{
  background:var(--parchment);color:#1A1710;border-radius:var(--r);
  padding:20px 18px;position:relative;overflow:auto;
  flex:1;min-height:210px;
  box-shadow:0 10px 30px rgba(0,0,0,.35);
}
.card::after{content:"";position:absolute;inset:5px;border:1px solid rgba(26,23,16,.14);border-radius:9px;pointer-events:none}
.qnum{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A7C5C;margin-bottom:10px}
.qimg{display:block;width:100%;max-width:300px;margin:0 auto 14px;border-radius:8px;box-shadow:0 2px 10px rgba(26,23,16,.25)}
.qtext{font-size:19.5px;line-height:1.42;font-weight:600;letter-spacing:-.005em;margin:0 0 12px}
ol.opts{list-style:none;margin:0;padding:0;font-size:15px;font-weight:400;line-height:1.45}
ol.opts li{display:flex;gap:9px;padding:4.5px 0;border-top:1px solid rgba(26,23,16,.1)}
ol.opts.quiz li{cursor:pointer;padding:9px 8px;margin:0 -8px;border-radius:8px;transition:background .12s}
ol.opts.quiz li:active{background:rgba(26,23,16,.07)}
ol.opts li.correct{background:rgba(127,150,104,.28);border-radius:8px;padding:9px 8px;margin:0 -8px;border-top-color:transparent}
ol.opts li.wrong{background:rgba(191,65,50,.2);border-radius:8px;padding:9px 8px;margin:0 -8px;border-top-color:transparent}
ol.opts li.correct b,ol.opts li.wrong b{color:#3F3A2A}
li .mark{margin-left:auto;font-weight:700;font-size:15px}
li.correct .mark{color:#4C6236} li.wrong .mark{color:#9E2E22}
.verdict{margin-top:13px;font-weight:600;font-size:14.5px;letter-spacing:.02em}
.verdict.ok{color:#4C6236} .verdict.no{color:#9E2E22}
.tap-hint{margin-top:12px;font-size:12.5px;color:#8A7C5C;letter-spacing:.03em}
ol.opts li b{font-weight:600;color:#8A7C5C;min-width:16px}
.answer{
  margin-top:14px;padding-top:13px;border-top:2px solid rgba(26,23,16,.2);
  font-size:16.5px;line-height:1.5;
}
.answer .tag{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#8A7C5C;margin-bottom:5px}
.answer strong{font-size:17.5px;font-weight:600;line-height:1.45}
.hidden{display:none}

/* ---- controls ---- */
.reveal{
  width:100%;margin-top:12px;padding:15px;border-radius:var(--r);
  background:var(--saffron);color:#231A08;font-weight:600;font-size:16px;letter-spacing:.02em;
}
.reveal:active{filter:brightness(.93)}
.sort{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.sort button{
  padding:13px 6px;border-radius:var(--r);font-size:13px;font-weight:600;
  border:1px solid rgba(240,233,216,.22);background:var(--ink-2);line-height:1.25;
}
.sort button small{display:block;font-weight:400;font-size:10.5px;color:var(--muted);margin-top:3px}
.sort .b-live{color:var(--saffron)} .sort .b-known{color:var(--olive)} .sort .b-imp{color:var(--crimson)} .sort .b-alm{color:var(--teal)}
.sort button.chosen{background:rgba(240,233,216,.1);border-color:currentColor;box-shadow:inset 0 0 0 1px currentColor}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px;font-size:13px;color:var(--muted)}
.nav button{padding:8px 12px;border-radius:9px;border:1px solid rgba(240,233,216,.16)}
.nav button:disabled{opacity:.32}
.empty{text-align:center;padding:44px 20px;color:#6E6249;font-family:"Alegreya",serif;font-size:19px;line-height:1.5}
footer{margin-top:14px;display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted)}
footer button{text-decoration:underline;text-underline-offset:3px;font-size:11.5px}
footer>span{display:flex;gap:6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Greek History <em>P.E.G.P.</em></h1>
    <span class="count" id="progress"></span>
  </header>

  <div class="piles" id="piles">
    <button class="pile" data-p="live"><span class="num" id="n-live">0</span><span class="lbl">Live</span></button>
    <button class="pile" data-p="known"><span class="num" id="n-known">0</span><span class="lbl">Known</span></button>
    <button class="pile" data-p="almost"><span class="num" id="n-almost">0</span><span class="lbl">Almost</span></button>
    <button class="pile" data-p="important"><span class="num" id="n-important">0</span><span class="lbl">Important</span></button>
  </div>

  <div class="stage">
    <div class="card" id="card"></div>
    <button class="reveal" id="reveal">Show answer</button>
    <div class="sort" id="sort">
      <button class="b-live" data-to="live">Live<small>see again</small></button>
      <button class="b-known" data-to="known">Known<small>I know it</small></button>
      <button class="b-alm" data-to="almost">Almost<small>not solid yet</small></button>
      <button class="b-imp" data-to="important">Important<small>needs work</small></button>
    </div>
    <div class="nav">
      <button id="prev">← Back</button>
      <button id="shuffle">Shuffle</button>
      <button id="next">Next →</button>
    </div>
  </div>

  <footer>
    <span id="setname"></span>
    <span><button id="backup">Backup / restore</button> · <button id="reset">Reset piles</button></span>
  </footer>
</div>

M("Σωστό ή Λάθος;\n1. Η Ελένη Σκούρα, η πρώτη ελληνίδα βουλευτής, εκλέχθηκε το 1953.\n2. Ο Βασιλιάς Όθωνας ήρθε στην Ελλάδα το 1821.\n3. Η Ελλάδα ήταν το πρώτο εθνικό κράτος στα Βαλκάνια που έγινε ανεξάρτητο, το 1830.\n4. Τόσο στον Α΄ όσο και στον Β΄ Παγκόσμιο Πόλεμο η Ελλάδα ήταν με τη μεριά των νικητών.",[],"1. Σ · 2. Λ · 3. Σ · 4. Σ")

const KEY='istoria-piles-v1';
const store={
  async get(){
    try{ if(window.storage){const r=await window.storage.get(KEY); if(r&&r.value) return JSON.parse(r.value);} }catch(e){}
    try{ const v=localStorage.getItem(KEY); return v?JSON.parse(v):null; }catch(e){ return null; }
  },
  async set(v){
    const s=JSON.stringify(v);
    try{ if(window.storage){ await window.storage.set(KEY,s); return; } }catch(e){}
    try{ localStorage.setItem(KEY,s); }catch(e){}
  }
};

let state={pile:'live',assign:DATA.map(()=>'live'),order:[],idx:0,shown:false,picked:null,dirty:false};
const LETTERS=['Α','Β','Γ','Δ'];
const PNAME={live:'Live',known:'Known',almost:'Almost',important:'Important'};
const $=id=>document.getElementById(id);

function buildOrder(keepId){
  state.order=DATA.map((_,i)=>i).filter(i=>state.assign[i]===state.pile);
  const at=keepId!=null?state.order.indexOf(keepId):-1;
  state.idx=at>-1?at:0;
}

function render(){
  ['live','known','almost','important'].forEach(p=>{
    $('n-'+p).textContent=state.assign.filter(x=>x===p).length;
    document.querySelector(`.pile[data-p="${p}"]`).classList.toggle('on',state.pile===p);
  });
  const card=$('card'), total=state.order.length;
  if(!total){
    card.innerHTML='<div class="empty">This pile is empty.<br>Pick another pile above.</div>';
    $('progress').textContent='';
    $('reveal').style.display='none'; $('sort').style.display='none';
    $('prev').disabled=$('next').disabled=true;
    return;
  }
  $('reveal').style.display=''; $('sort').style.display='';
  $('prev').disabled=$('next').disabled=false;
  const id=state.order[state.idx], q=DATA[id];
  $('progress').textContent=`${state.idx+1} / ${total}`;
  let html=`<div class="qnum">Question ${id+1}</div><p class="qtext">${esc(q.q).replace(/\n/g,'<br>')}</p>`;
  if(IMG[id+1]) html+=`<img class="qimg" src="${IMG[id+1]}" alt="">`;
  const mcq=q.o.length>0, done=state.picked!==null;
  if(mcq){
    const ci=LETTERS.indexOf(q.a);
    html+=`<ol class="opts${done?'':' quiz'}">`+q.o.map((t,i)=>{
      let cls='',mark='';
      if(done){
        if(i===ci){cls=' class="correct"';mark='<span class="mark">✓</span>';}
        else if(i===state.picked){cls=' class="wrong"';mark='<span class="mark">✕</span>';}
      }
      return `<li${cls} data-i="${i}"><b>${LETTERS[i]}.</b><span>${esc(t)}</span>${mark}</li>`;
    }).join('')+'</ol>';
    if(done){
      const ok=state.picked===ci;
      html+=`<div class="verdict ${ok?'ok':'no'}">${ok?'Correct':'Wrong'} — filed under ${PNAME[state.assign[id]]}</div>`;
    } else {
      html+='<div class="tap-hint">Tap the answer you think is correct</div>';
    }
  }
  if(!mcq||done) html+=`<div class="answer${state.shown?'':' hidden'}" id="ans"><span class="tag">Answer</span><strong>${esc(q.o.length?q.a+'. '+q.o[LETTERS.indexOf(q.a)]:q.a)}</strong></div>`;
  card.innerHTML=html;
  card.scrollTop=0;
  document.querySelectorAll('#sort button').forEach(b=>b.classList.toggle('chosen',state.assign[id]===b.dataset.to));
  $('reveal').style.display=mcq?'none':'';
  $('sort').style.display=(mcq?done:state.shown)?'':'none';
  $('reveal').textContent=state.shown?'Hide answer':'Show answer';
}
const esc=s=>s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function step(d){
  if(!state.order.length)return;
  if(state.dirty){
    const cur=state.order[state.idx], pos=state.idx;
    state.dirty=false; state.picked=null;
    buildOrder();
    if(!state.order.length){state.shown=false;render();return;}
    const at=state.order.indexOf(cur);
    state.idx = at>-1 ? (at+d+state.order.length)%state.order.length
                      : (d>0 ? pos%state.order.length
                             : (pos-1+state.order.length)%state.order.length);
    state.shown=false; render(); return;
  }
  state.picked=null;
  state.idx=(state.idx+d+state.order.length)%state.order.length;
  state.shown=false; render();
}

$('card').onclick=e=>{
  const li=e.target.closest('ol.opts.quiz li'); if(!li||!state.order.length)return;
  const id=state.order[state.idx], q=DATA[id];
  state.picked=+li.dataset.i;
  state.assign[id]=(state.picked===LETTERS.indexOf(q.a))?'known':'important';
  state.dirty=true; state.shown=true;
  store.set(state.assign);
  render();
};
$('reveal').onclick=()=>{state.shown=!state.shown; render();};
$('next').onclick=()=>step(1);
$('prev').onclick=()=>step(-1);
$('shuffle').onclick=()=>{
  for(let i=state.order.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[state.order[i],state.order[j]]=[state.order[j],state.order[i]];}
  state.idx=0; state.shown=false; state.picked=null; render();
};
$('piles').onclick=e=>{
  const b=e.target.closest('.pile'); if(!b)return;
  state.pile=b.dataset.p; state.shown=false; state.picked=null; state.dirty=false; buildOrder(); render();
};
$('sort').onclick=e=>{
  const b=e.target.closest('button'); if(!b||!state.order.length)return;
  const id=state.order[state.idx];
  state.assign[id]=b.dataset.to;
  store.set(state.assign);
  state.dirty=true;
  render();
};
const CODE={live:'L',known:'K',almost:'A',important:'I'};
const UNCODE={L:'live',K:'known',A:'almost',I:'important'};
$('backup').onclick=()=>{
  const code=state.assign.map(x=>CODE[x]).join('');
  const inp=prompt('Your progress code — copy it somewhere safe.\n\nTo restore an earlier one, paste it here and press OK.',code);
  if(inp===null)return;
  const c=inp.trim().toUpperCase();
  if(c===code)return;
  if(c.length!==DATA.length||[...c].some(ch=>!UNCODE[ch])){alert('That code does not look right — no changes made.');return;}
  state.assign=[...c].map(ch=>UNCODE[ch]);
  store.set(state.assign);
  state.picked=null; state.dirty=false; state.shown=false;
  buildOrder(); render();
  alert('Progress restored.');
};
$('reset').onclick=()=>{
  if(!confirm('Move all 80 cards back to Live?'))return;
  state.assign=DATA.map(()=>'live'); store.set(state.assign);
  state.pile='live'; state.picked=null; state.dirty=false; buildOrder(); state.shown=false; render();
};
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight')step(1);
  else if(e.key==='ArrowLeft')step(-1);
  else if(e.key===' '){e.preventDefault();$('reveal').click();}
});

$('setname').textContent=DATA.length+' questions · November 2026';
(async()=>{
  const saved=await store.get();
  if(Array.isArray(saved)&&saved.length===DATA.length) state.assign=saved;
  buildOrder(); render();
})();
</script>
